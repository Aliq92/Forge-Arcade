<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="Mandelbrot Explorer — an elegant, infinitely deep fractal exploration toy." />
    <title>Mandelbrot Explorer</title>
    <link rel="icon" href="data:,">
    <script type="module" crossorigin src="./assets/index-324e7ec1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D640x9CW.css">
  </head>
  <body>
    <div id="app">
      <canvas id="fractal-canvas"></canvas>

      <section id="intro" aria-hidden="false">
        <div class="intro-content">
          <h1 class="intro-title">MANDELBROT EXPLORER</h1>
          <p class="intro-tagline">&ldquo;Infinity hides between the numbers.&rdquo;</p>
          <button id="begin-dive" class="btn btn-primary">BEGIN DIVE</button>
        </div>
      </section>

      <div id="hud" class="panel hud" aria-hidden="true">
        <div class="hud-row"><span class="hud-label">X</span><span id="hud-x" class="hud-value" tabindex="0"></span></div>
        <div class="hud-row"><span class="hud-label">Y</span><span id="hud-y" class="hud-value" tabindex="0"></span></div>
        <div class="hud-row"><span class="hud-label">Zoom</span><span id="hud-zoom" class="hud-value"></span></div>
        <div class="hud-row"><span class="hud-label">Iter</span><span id="hud-iter" class="hud-value"></span></div>
        <div class="hud-row"><span class="hud-label">Frame</span><span id="hud-fps" class="hud-value"></span></div>
        <div id="hud-precision" class="hud-precision" hidden>Precision limit reached</div>
      </div>

      <div id="toast" class="toast" hidden></div>

      <div id="controls" class="panel controls" aria-hidden="true">
        <div class="controls-row">
          <button id="btn-zoom-in" class="icon-btn" title="Zoom In" aria-label="Zoom In">+</button>
          <button id="btn-zoom-out" class="icon-btn" title="Zoom Out" aria-label="Zoom Out">&minus;</button>
          <button id="btn-reset" class="icon-btn" title="Reset View" aria-label="Reset View">&#8634;</button>
          <button id="btn-random-dive" class="icon-btn wide" title="Random Dive" aria-label="Random Dive">RANDOM DIVE</button>
        </div>
        <div class="controls-row">
          <button id="btn-iter-down" class="icon-btn" title="Fewer Iterations" aria-label="Iterations minus">Iter &minus;</button>
          <button id="btn-iter-up" class="icon-btn" title="More Iterations" aria-label="Iterations plus">Iter +</button>
          <button id="btn-save" class="icon-btn" title="Save Location" aria-label="Save Location">&#9733; Save</button>
          <button id="btn-places" class="icon-btn" title="Places" aria-label="Places">Places</button>
          <button id="btn-palette" class="icon-btn" title="Palette" aria-label="Palette">Palette</button>
        </div>
      </div>

      <div id="palette-panel" class="panel side-panel" hidden>
        <div class="panel-header"><span>Palette</span><button class="close-btn" data-close="palette-panel">&times;</button></div>
        <div id="palette-list" class="palette-list"></div>
      </div>

      <div id="places-panel" class="panel side-panel" hidden>
        <div class="panel-header"><span>Places</span><button class="close-btn" data-close="places-panel">&times;</button></div>
        <div class="places-scroll">
          <p class="section-label">Destinations</p>
          <div id="presets-list" class="entry-list"></div>
          <p class="section-label">Saved Locations</p>
          <div id="bookmarks-list" class="entry-list"></div>
          <p id="bookmarks-empty" class="empty-note">No saved locations yet. Explore, then tap Save.</p>
        </div>
      </div>
    </div>
    <a href="../../index.html" id="forge-back-link" style="position:fixed;right:12px;bottom:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font:500 12px/1.2 system-ui,-apple-system,sans-serif;color:#e8e8ec;background:rgba(10,10,14,.55);border:1px solid rgba(255,255,255,.14);border-radius:999px;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.55;transition:opacity .15s ease;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">← Arcade</a>
  </body>
</html>
