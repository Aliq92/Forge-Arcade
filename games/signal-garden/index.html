<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Signal Garden — Forge Arcade</title>
<style>
:root{--bg:#050608;--panel:rgba(9,13,18,.82);--line:rgba(140,180,220,.18);--text:#dbe7f0;--dim:#8795a4;--cyan:#4dd9ec;--violet:#b592ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#050608}
#head{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;z-index:3}h1{margin:0;font-size:15px;letter-spacing:5px;color:#8de8ff;text-shadow:0 0 16px rgba(77,217,236,.45)}#head small{display:block;margin-top:4px;font-size:9px;letter-spacing:3px;color:var(--dim)}
#tools{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:7px;z-index:8}.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);display:grid;place-items:center;font-size:16px;cursor:pointer;backdrop-filter:blur(8px)}.icon-btn.active{color:var(--cyan);border-color:rgba(77,217,236,.5)}
#panel{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:9;background:linear-gradient(to top,rgba(4,5,7,.96),rgba(4,5,7,.55) 85%,transparent)}#panel.hidden{transform:translateY(110%);pointer-events:none;opacity:0}#inner{max-width:760px;margin:auto;padding:11px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);display:grid;gap:9px}.row{display:flex;gap:8px;flex-wrap:wrap}.group{flex:1;min-width:96px}.group label{display:block;margin-bottom:4px;font-size:9px;letter-spacing:1.4px;color:var(--dim)}select,input,.btn{width:100%;font:inherit;color:var(--text)}select{height:44px;border:1px solid var(--line);border-radius:9px;background:#10151b;padding:0 10px}input[type=range]{height:30px;accent-color:var(--cyan)}.btn{min-height:44px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.05);cursor:pointer}.btn.on{color:var(--cyan);border-color:rgba(77,217,236,.48);background:rgba(77,217,236,.12)}.btn.danger{color:#ef9a9a}.actions .btn{flex:1;min-width:92px}
#show{position:fixed;left:50%;bottom:env(safe-area-inset-bottom);transform:translateX(-50%);display:none;z-index:10;padding:10px 24px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;background:var(--panel);color:var(--dim);font-size:10px;letter-spacing:2px}#hint{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;color:rgba(219,231,240,.6);font-size:12px;letter-spacing:2px;text-align:center;pointer-events:none;transition:.4s}#hint span{display:block;margin-top:8px;font-size:9px;color:rgba(219,231,240,.3)}#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:20;padding:8px 15px;border-radius:18px;border:1px solid var(--line);background:rgba(7,10,14,.92);opacity:0;transition:.25s;font-size:11px}#toast.show{opacity:1}
@media(max-width:520px){#inner{max-height:44vh;overflow:auto}.actions .btn{min-width:30%}#head{top:calc(58px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="head"><h1>SIGNAL GARDEN</h1><small>A FIELD OF INTERFERENCE</small></div>
<div id="hint">TAP TO PLANT A SIGNAL<span>drag nodes · tap a node to retune · hold to remove</span></div>
<div id="tools"><button class="icon-btn" id="audio" aria-label="Toggle audio">♪</button><button class="icon-btn" id="shot" aria-label="Save image">⧉</button><button class="icon-btn" id="full" aria-label="Fullscreen">⛶</button></div>
<div id="panel"><div id="inner">
<div class="row"><div class="group"><label>MODE</label><select id="mode"><option value="freeform">Freeform</option><option value="resonance">Resonance</option><option value="zen">Zen</option><option value="chaos">Chaos</option></select></div><div class="group"><label>NODE TYPE</label><select id="type"><option value="pulse">Pulse</option><option value="continuous">Continuous</option><option value="phase">Phase</option><option value="absorber">Absorber</option></select></div></div>
<div class="row"><div class="group"><label>FREQUENCY <span id="freqVal"></span></label><input id="freq" type="range" min=".2" max="3" step=".01" value="1"></div><div class="group"><label>SIGNAL SPEED <span id="speedVal"></span></label><input id="speed" type="range" min=".2" max="2.2" step=".01" value="1"></div><div class="group"><label>GLOW <span id="glowVal"></span></label><input id="glow" type="range" min=".25" max="1.35" step=".01" value=".82"></div></div>
<div class="row actions"><button class="btn" id="drift">Auto Drift</button><button class="btn" id="pause">Pause</button><button class="btn danger" id="clear">Clear</button><button class="btn" id="random">Randomize</button><button class="btn" id="hide">Hide UI</button></div>
</div></div><button id="show">SHOW CONTROLS</button><div id="toast"></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#field'),x=c.getContext('2d',{alpha:false}),b=document.createElement('canvas'),bx=b.getContext('2d');
const $=s=>document.querySelector(s),clamp=(v,a,z)=>Math.max(a,Math.min(z,v)),rnd=(a,z)=>a+Math.random()*(z-a);
let W=innerWidth,H=innerHeight,D=1,BW=140,BH=90,img,pix,nodes=[],sel=null,t=0,last=performance.now(),paused=false,drift=false,audio=false,aCtx,master,drag=null,holdTimer;
const hue={pulse:190,continuous:265,phase:38,absorber:210},MAX=28;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*D);c.height=Math.round(H*D);c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);const isCompact=Math.min(W,H)<700;const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;const bufMax=reducedMotion?110:(isCompact?140:190);if(W>=H){BW=bufMax;BH=Math.max(52,Math.round(bufMax*H/W))}else{BH=bufMax;BW=Math.max(52,Math.round(bufMax*W/H))}b.width=BW;b.height=BH;img=bx.createImageData(BW,BH);pix=img.data}addEventListener('resize',resize);resize();
function rgb(h){h=(h%360+360)%360;let s=.72,l=.58,c0=(1-Math.abs(2*l-1))*s,q=c0*(1-Math.abs(h/60%2-1)),m=l-c0/2,r=0,g=0,bl=0;if(h<60){r=c0;g=q}else if(h<120){r=q;g=c0}else if(h<180){g=c0;bl=q}else if(h<240){g=q;bl=c0}else if(h<300){r=q;bl=c0}else{r=c0;bl=q}return[(r+m)*255,(g+m)*255,(bl+m)*255]}
function node(px,py,type=$('#type').value){return{x:px,y:py,type,f:+$('#freq').value,phase:rnd(0,Math.PI*2),seed:rnd(0,99),h:hue[type]+rnd(-14,14),born:t}}
function params(){return $('#mode').value==='zen'?{spd:.46,sat:.75,jit:.01}:$('#mode').value==='chaos'?{spd:1.55,sat:1.18,jit:.38}:$('#mode').value==='resonance'?{spd:1,sat:1.08,jit:.04,boost:1}:{spd:1,sat:1,jit:.04}}
function field(){const p=params(),u=Math.min(W,H)||1,gain=+$('#glow').value*155;for(let yy=0;yy<BH;yy++){let wy=(yy+.5)/BH*H/u;for(let xx=0;xx<BW;xx++){let wx=(xx+.5)/BW*W/u,R=0,G=0,B=0,A=0;for(const n of nodes){let dx=wx-n.x/u,dy=wy-n.y/u,r=Math.hypot(dx,dy),f=Math.max(.08,n.f*(1+Math.sin(t*.6+n.seed)*p.jit));if(n.type==='absorber'){A+=1/(1+r*9);continue}let v;if(n.type==='pulse'){let per=3/f,front=((t-n.born)%per+per)%per*.42*p.spd,d=r-front,w=.03+.012/f;v=Math.exp(-(d*d)/(2*w*w))}else v=Math.sin(f*15.5*r-f*3.1*t*p.spd+n.phase)/(1+r*2.1);let col=rgb(n.h);R+=col[0]*v*.0039;G+=col[1]*v*.0039;B+=col[2]*v*.0039}let af=1/(1+A*2.1);R*=af;G*=af;B*=af;if(p.boost&&Math.hypot(R,G,B)>.6){R+=35;G+=42;B+=48}let av=(R+G+B)/3;R=av+(R-av)*p.sat;G=av+(G-av)*p.sat;B=av+(B-av)*p.sat;let i=(yy*BW+xx)*4;pix[i]=clamp(5+R*gain,0,255);pix[i+1]=clamp(6+G*gain,0,255);pix[i+2]=clamp(9+B*gain,0,255);pix[i+3]=255}}bx.putImageData(img,0,0)}
function drawNodes(){for(const n of nodes){let col=rgb(n.h),r=n.type==='absorber'?9:7;x.save();let q=x.createRadialGradient(n.x,n.y,0,n.x,n.y,r*3.2);q.addColorStop(0,n.type==='absorber'?'rgba(20,26,34,.9)':`rgba(${col[0]|0},${col[1]|0},${col[2]|0},.9)`);q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.beginPath();x.arc(n.x,n.y,r*3.2,0,7);x.fill();x.strokeStyle=n===sel?'white':`rgba(${col[0]|0},${col[1]|0},${col[2]|0},.75)`;x.lineWidth=n===sel?2:1;x.beginPath();x.arc(n.x,n.y,r,0,7);x.stroke();x.restore()}}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){t+=dt*+$('#speed').value*params().spd;if(drift)for(const n of nodes){n.f=clamp(n.f+Math.sin(t*.2+n.seed)*.0008,.2,3);n.h+=Math.sin(t*.08+n.seed)*.05}}field();x.drawImage(b,0,0,BW,BH,0,0,W,H);drawNodes();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function hit(px,py){for(let i=nodes.length-1;i>=0;i--)if(Math.hypot(nodes[i].x-px,nodes[i].y-py)<30)return nodes[i]}
function add(px,py){if(nodes.length>=MAX)return toast('Field is full');let n=node(px,py);nodes.push(n);sel=n;sync();tone(n)}function sync(){if(sel){$('#freq').value=sel.f;$('#freqVal').textContent=sel.f.toFixed(2)}}
c.addEventListener('pointerdown',e=>{ $('#hint').style.opacity=0;let n=hit(e.clientX,e.clientY);drag={n,sx:e.clientX,sy:e.clientY,moved:false,ox:n?e.clientX-n.x:0,oy:n?e.clientY-n.y:0};if(n){sel=n;sync();holdTimer=setTimeout(()=>{nodes=nodes.filter(v=>v!==n);stopTone(n);drag.done=true;toast('Signal removed')},600)}c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag||drag.done)return;let d=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy);if(d>10)drag.moved=true;if(drag.n&&drag.moved){clearTimeout(holdTimer);drag.n.x=clamp(e.clientX-drag.ox,10,W-10);drag.n.y=clamp(e.clientY-drag.oy,10,H-10)}});
c.addEventListener('pointerup',e=>{clearTimeout(holdTimer);if(!drag||drag.done){drag=null;return}if(drag.n&&!drag.moved){drag.n.f=drag.n.f>=3?.35:Math.min(3,drag.n.f+.35);sync();tone(drag.n)}else if(!drag.n&&!drag.moved)add(e.clientX,e.clientY);drag=null});
function toast(m){let q=$('#toast');q.textContent=m;q.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>q.classList.remove('show'),1200)}
function ensureAudio(){if(aCtx)return;aCtx=new(window.AudioContext||window.webkitAudioContext)();master=aCtx.createGain();master.gain.value=.04;master.connect(aCtx.destination)}
function tone(n){if(!audio||n.type==='absorber')return;ensureAudio();n.osc=n.osc||aCtx.createOscillator();if(!n.gain){n.gain=aCtx.createGain();n.gain.gain.value=.18;n.osc.type='sine';n.osc.connect(n.gain);n.gain.connect(master);n.osc.start()}n.osc.frequency.setTargetAtTime(90+n.f*70,aCtx.currentTime,.1)}function stopTone(n){try{n.osc&&n.osc.stop()}catch{}}
$('#freq').addEventListener('input',e=>{ $('#freqVal').textContent=(+e.target.value).toFixed(2);if(sel){sel.f=+e.target.value;tone(sel)}});for(const id of ['speed','glow'])$('#'+id).addEventListener('input',e=>$('#'+id+'Val').textContent=(+e.target.value).toFixed(2));$('#speedVal').textContent='1.00';$('#glowVal').textContent='.82';$('#freqVal').textContent='1.00';
$('#drift').onclick=e=>{drift=!drift;e.currentTarget.classList.toggle('on',drift);toast(drift?'Auto Drift on':'Auto Drift off')};$('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause';e.currentTarget.classList.toggle('on',paused)};$('#clear').onclick=()=>{nodes.forEach(stopTone);nodes=[];sel=null;toast('Field cleared')};$('#random').onclick=()=>{nodes.forEach(stopTone);nodes=[];let types=['pulse','continuous','phase','absorber'],count=5+Math.floor(Math.random()*4);for(let i=0;i<count;i++)nodes.push(node(rnd(W*.15,W*.85),rnd(H*.18,H*.68),types[Math.floor(Math.random()*types.length)]));toast('Arrangement randomized')};$('#hide').onclick=()=>{$('#panel').classList.add('hidden');$('#show').style.display='block'};$('#show').onclick=()=>{$('#panel').classList.remove('hidden');$('#show').style.display='none'};
$('#audio').onclick=e=>{audio=!audio;e.currentTarget.classList.toggle('active',audio);if(audio){ensureAudio();aCtx.resume();nodes.forEach(tone)}else if(master)master.gain.setTargetAtTime(0,aCtx.currentTime,.1);if(audio&&master)master.gain.setTargetAtTime(.04,aCtx.currentTime,.1);toast(audio?'Audio on':'Audio off')};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen().catch(()=>{}):document.documentElement.requestFullscreen().catch(()=>{});$('#shot').onclick=()=>{try{let a=document.createElement('a');a.download='signal-garden.png';a.href=c.toDataURL('image/png');a.click();toast('Image saved')}catch{toast('Image save unavailable')}};
nodes=[node(W*.39,H*.42,'pulse'),node(W*.61,H*.38,'continuous')];
})();
</script>
</body></html>
