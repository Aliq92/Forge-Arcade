<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Impossible Garden</title><body style="margin:0;background:#07080c;color:#f0ebe3;font:14px system-ui"><div id="boot" style="position:fixed;inset:0;display:grid;place-items:center">Growing the impossible garden…</div><script>(async()=>{const parts=await Promise.all([1,2,3,4,5,6].map(n=>fetch(`./payload/part-${String(n).padStart(2,"0")}.txt`).then(r=>{if(!r.ok)throw Error(`payload ${n}`);return r.text()})));const s=parts.join("").trim();const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{console.error(e);document.getElementById("boot").textContent="Impossible Garden could not grow."})</script>
