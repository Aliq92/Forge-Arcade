<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1118" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <title>God in a Jar — A universe that remembers</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="arcade.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"
        ><span class="brand-mark">◈</span
        ><span>GOD IN A JAR<small>A UNIVERSE THAT REMEMBERS</small></span></a
      >
      <nav>
        <button id="journal">Journal <span>J</span></button
        ><button id="observe">Observe <span>O</span></button
        ><button id="experiment">Experiment <span>↗</span></button>
      </nav>
    </header>
    <main>
      <canvas
        id="world"
        aria-label="A living miniature ecosystem inside a glass jar"
      ></canvas>
      <div class="specimen">
        <span class="eyebrow">LIVE SPECIMEN / 001</span>
        <h1>The Unwritten</h1>
        <p>Small lives. Lasting consequences.</p>
      </div>
      <div class="stats">
        <div>
          <span class="eyebrow">ELAPSED</span><strong id="day">Day 1</strong>
        </div>
        <div>
          <span class="eyebrow">LIVING</span
          ><strong id="population">6 creatures</strong>
        </div>
        <div>
          <span class="eyebrow">LINEAGE</span
          ><strong id="generation">Generation 1</strong>
        </div>
      </div>
      <div id="hint">
        <span class="hint-dot"></span><b>TOUCH THE GLASS</b
        ><small>Change the conditions. Watch life respond.</small>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div class="zoom">
        <button id="zoom-out" aria-label="Zoom out">−</button
        ><span id="zoom-level">100%</span
        ><button id="zoom-in" aria-label="Zoom in">+</button
        ><button id="reset-camera" aria-label="Reset view">⌖</button>
      </div>
      <aside id="panel" hidden></aside>
      <button id="exit-observe" hidden>Return to controls</button>
      <a id="forge-back-link" href="../../index.html" aria-label="Return to Forge Arcade">← Forge Arcade</a>
    </main>
    <footer>
      <div class="powers" role="group" aria-label="Environmental powers">
        <button class="active" data-power="TOUCH">
          <i>◎</i><span>Touch</span><kbd>1</kbd></button
        ><button data-power="LIGHT">
          <i>☼</i><span>Light</span><kbd>2</kbd></button
        ><button data-power="RAIN"><i>⠿</i><span>Rain</span><kbd>3</kbd></button
        ><button data-power="MUTATE">
          <i>✧</i><span>Mutate</span><kbd>4</kbd></button
        ><button data-power="DISTORT">
          <i>⌁</i><span>Distort</span><kbd>5</kbd>
        </button>
      </div>
      <div class="time">
        <span class="eyebrow">TIME</span>
        <div role="group" aria-label="Simulation speed">
          <button data-speed="0" aria-label="Pause">Ⅱ</button
          ><button class="active" data-speed="1">1×</button
          ><button data-speed="5">5×</button><button data-speed="20">20×</button
          ><button data-speed="100">100×</button>
        </div>
        <small id="effective">Real time</small>
      </div>
      <button id="settings" aria-label="Settings">⚙</button>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
