<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gravity Sandbox</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="sim-canvas"></canvas>

<div class="mode-bar" id="mode-bar">
  <button class="mode-btn active" data-mode="spawn" title="Spawn (S)"><span class="mode-icon">&#10022;</span><span class="mode-text">Spawn</span></button>
  <button class="mode-btn" data-mode="select" title="Select (V)"><span class="mode-icon">&#9678;</span><span class="mode-text">Select</span></button>
  <button class="mode-btn" data-mode="pan" title="Pan (H)"><span class="mode-icon">&#10021;</span><span class="mode-text">Pan</span></button>
  <button class="mode-btn mode-only-mobile" id="btn-play-mobile" title="Pause / Play (Space)"><span class="mode-icon" id="mode-play-icon">&#10074;&#10074;</span></button>
  <button class="mode-btn mode-only-mobile" id="btn-menu-mobile" title="Menu">&#9776;</button>
</div>

<div class="hud">

  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>GRAVITY SANDBOX</div>
    <div class="topbar-actions">
      <button id="btn-toggle-hud" class="icon-btn" title="Toggle panels">&#9776;</button>
    </div>
  </header>

  <div class="stats-bar" id="stats-bar">
    <div class="stat"><span>Bodies</span><b id="stat-bodies">0</b></div>
    <div class="stat"><span>Sim Time</span><b id="stat-time">0.0s</b></div>
    <div class="stat"><span>Speed</span><b id="stat-speed">1x</b></div>
    <div class="stat"><span>FPS</span><b id="stat-fps">60</b></div>
  </div>

  <div class="panels" id="panels">

    <section class="panel panel-spawn">
      <h2>Spawn</h2>
      <div class="type-grid" id="type-grid">
        <button class="type-btn active" data-type="planet"><span class="swatch swatch-planet"></span>Planet</button>
        <button class="type-btn" data-type="moon"><span class="swatch swatch-moon"></span>Moon</button>
        <button class="type-btn" data-type="star"><span class="swatch swatch-star"></span>Star</button>
        <button class="type-btn" data-type="blackhole"><span class="swatch swatch-blackhole"></span>Black Hole</button>
      </div>
      <label class="field">
        <span class="field-label">Mass <b id="spawn-mass-value">50</b></span>
        <input type="range" id="spawn-mass" min="1" max="500" step="1" value="50">
      </label>
      <div class="field">
        <span class="field-label">Trajectory</span>
        <div class="seg-group" id="trajectory-group">
          <button data-traj="off">Off</button>
          <button data-traj="short">Short</button>
          <button data-traj="medium" class="active">Medium</button>
          <button data-traj="long">Long</button>
        </div>
      </div>
      <p class="hint" id="spawn-hint">Click empty space to place &middot; drag to launch</p>
    </section>

    <section class="panel panel-sim">
      <h2>Simulation</h2>
      <div class="btn-row">
        <button id="btn-play" class="primary-btn">Pause</button>
        <button id="btn-step" title="Advance one step (paused)">Step</button>
      </div>
      <div class="btn-row">
        <button id="btn-reset">Reset</button>
        <button id="btn-clear">Clear All</button>
      </div>
      <div class="field">
        <span class="field-label">Speed</span>
        <div class="speed-group" id="speed-group">
          <button data-speed="0.25">0.25x</button>
          <button data-speed="0.5">0.5x</button>
          <button data-speed="1" class="active">1x</button>
          <button data-speed="2">2x</button>
          <button data-speed="4">4x</button>
          <button data-speed="8">8x</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Collisions</span>
        <div class="seg-group" id="collision-group">
          <button data-collision="merge" class="active">Merge</button>
          <button data-collision="bounce">Bounce</button>
          <button data-collision="pass">Pass</button>
        </div>
      </div>
      <div class="btn-row">
        <button id="btn-camera-reset">Reset Camera</button>
        <button id="btn-fit-all">Fit All</button>
      </div>
    </section>

    <section class="panel panel-display">
      <h2>Display</h2>
      <div class="toggle-row">
        <button class="toggle-btn active" data-toggle="trails">Trails</button>
        <button class="toggle-btn active" data-toggle="labels">Labels</button>
        <button class="toggle-btn" data-toggle="vectors">Velocity</button>
        <button class="toggle-btn" data-toggle="com">Center of Mass</button>
        <button class="toggle-btn" data-toggle="field">Gravity Field</button>
      </div>
      <div class="field">
        <span class="field-label">Trail Length</span>
        <div class="seg-group" id="trail-length-group">
          <button data-traillen="off">Off</button>
          <button data-traillen="short">Short</button>
          <button data-traillen="medium" class="active">Med</button>
          <button data-traillen="long">Long</button>
        </div>
      </div>
    </section>

    <section class="panel panel-presets">
      <h2>Presets</h2>
      <div class="btn-col">
        <button data-preset="earth-moon">Earth + Moon</button>
        <button data-preset="solar-system">Solar System</button>
        <button data-preset="binary-stars">Binary Stars</button>
        <button data-preset="three-body">Three-Body Chaos</button>
        <button data-preset="slingshot-lab">Slingshot Lab</button>
        <button data-preset="triple-star">Triple Star</button>
        <button data-preset="black-hole-system">Black Hole System</button>
        <button data-preset="double-planet">Double Planet</button>
        <button data-preset="collision-course">Collision Course</button>
        <button data-preset="empty">Empty Space</button>
      </div>
    </section>

    <section class="panel panel-system">
      <h2>System</h2>
      <div class="btn-col">
        <button id="btn-save">Save System</button>
        <button id="btn-load">Load System</button>
        <button id="btn-cinematic">Cinematic Mode</button>
      </div>
    </section>

  </div>

  <aside class="panel panel-inspector" id="inspector" hidden>
    <div class="inspector-header">
      <h2>Inspector</h2>
      <button id="btn-close-inspector" class="icon-btn" title="Close">&#10005;</button>
    </div>
    <label class="field">
      <span class="field-label">Name</span>
      <input type="text" id="insp-name" maxlength="24">
    </label>
    <div class="field-static"><span>Type</span><b id="insp-type">&mdash;</b></div>
    <label class="field">
      <span class="field-label">Mass <b id="insp-mass-value">0</b></span>
      <input type="range" id="insp-mass" min="1" max="20000" step="1">
    </label>
    <div class="vxvy-row">
      <label class="field">
        <span class="field-label">VX</span>
        <input type="number" id="insp-vx" step="1">
      </label>
      <label class="field">
        <span class="field-label">VY</span>
        <input type="number" id="insp-vy" step="1">
      </label>
    </div>
    <div class="field-static"><span>Speed</span><b id="insp-speed">0</b></div>
    <div class="field-static"><span>Position</span><b id="insp-position">0, 0</b></div>
    <button id="btn-fixed" class="toggle-btn full-toggle">Fixed Position</button>
    <div class="insp-grid">
      <button id="btn-focus">Focus</button>
      <button id="btn-follow">Follow</button>
      <button id="btn-duplicate">Duplicate</button>
      <button id="btn-reverse">Reverse Velocity</button>
    </div>
    <button id="btn-delete" class="danger-btn full-btn">Delete Body</button>
  </aside>

</div>

<button class="cinematic-exit" id="btn-cinematic-exit" hidden>&#10005; Exit Cinematic</button>
<div class="toast" id="toast"></div>

<script src="script.js"></script>
<a href="../../index.html" id="forge-back-link" style="position:fixed;right:12px;bottom:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font:500 12px/1.2 system-ui,-apple-system,sans-serif;color:#e8e8ec;background:rgba(10,10,14,.55);border:1px solid rgba(255,255,255,.14);border-radius:999px;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.55;transition:opacity .15s ease;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">← Arcade</a></body>
</html>
