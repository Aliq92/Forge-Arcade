<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <title>Forge Beast — Forge Arcade</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="module/forge-beast.css">
  <link rel="stylesheet" href="host.css">
</head>
<body class="arcade-game-page">
  <div class="arcade-game-shell">
    <header class="arcade-game-bar">
      <a href="../../index.html" id="arcade-back" aria-label="Exit Forge Beast and return to Forge Arcade">← Arcade</a>
      <span>FORGE BEAST</span>
      <button type="button" id="arcade-pause" aria-label="Pause Forge Beast" aria-pressed="false">Pause</button>
    </header>
    <main class="arcade-game-viewport" id="game-viewport" aria-label="Forge Beast game viewport"></main>
    <p id="game-message" class="arcade-game-message" role="status">Loading game…</p>
  </div>
  <script type="module" src="host.mjs"></script>
</body>
</html>
