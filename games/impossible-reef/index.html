<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Impossible Reef</title>
<meta name="description" content="A peaceful underwater garden of impossible coral. Plant, tend, crossbreed, and watch it breathe.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="reef-canvas"></canvas>
<div id="ui-layer">
  <div id="topbar"><div id="title-block"><h1 id="title">IMPOSSIBLE REEF</h1><p id="subtitle">GROW WHAT SHOULD NOT EXIST</p></div><div id="mood-label" aria-hidden="true"></div></div>
  <div id="hint" class="hint">PLANT A SPORE</div><div id="event-banner" aria-hidden="true"></div>
  <div id="inspect-panel" class="hidden"><div id="inspect-name">—</div><div id="inspect-detail">—</div></div>
  <div id="bottombar">
    <div id="species-row" role="listbox" aria-label="Reef species"></div>
    <div id="action-row">
      <button class="action-btn" id="btn-nurture" title="Nurture selected organism"><span>Nurture</span></button>
      <button class="action-btn" id="btn-remove" title="Remove selected organism"><span>Remove</span></button>
      <button class="action-btn" id="btn-clear" title="Clear the whole reef"><span>Clear</span></button>
      <button class="action-btn" id="btn-hideui" title="Hide interface / Zen mode"><span>Zen</span></button>
    </div>
    <div id="mini-row">
      <button class="mini-btn" id="btn-sound" title="Toggle sound" aria-pressed="false">♪</button>
      <button class="mini-btn" id="btn-motion" title="Toggle reduced motion" aria-pressed="false">≈</button>
      <button class="mini-btn" id="btn-autogrow" title="Toggle auto grow" aria-pressed="false">+</button>
      <button class="mini-btn" id="btn-save-image" title="Save reef as image">↓</button>
    </div>
  </div>
  <button id="btn-restore" class="hidden" title="Restore controls">○</button>
</div>
<script src="loader.js"></script>
</body>
</html>
