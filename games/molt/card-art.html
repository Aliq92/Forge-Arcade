<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Molt · Colourful Creatures card artwork</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#09262c}canvas{display:block;width:1200px;height:675px}</style>
<canvas width="1200" height="675" aria-label="A simple golden creature with two expressive eyes emerging from its shell in a colourful pool"></canvas>
<script src="living-world.js?v=13"></script>
<script>
// Static composition from the same procedural creature renderer as the game.
// Export at native resolution; deliberately not connected to the arcade cards.
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),art=new MoltPresentation();
art.reduced=true;art.backdrop(ctx,1200,675,{x:820,y:330,vx:0,vy:0});
const shade=ctx.createLinearGradient(0,0,1200,0);shade.addColorStop(0,'#061d29eb');shade.addColorStop(.6,'#061d2900');ctx.fillStyle=shade;ctx.fillRect(0,0,1200,675);
for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=175+(i%4)*16;ctx.fillStyle=i%3?'#b9ebc960':'#f5d9a580';ctx.beginPath();ctx.arc(820+Math.cos(a)*r,335+Math.sin(a)*r*.8,1.5+i%3,0,Math.PI*2);ctx.fill();}
ctx.strokeStyle='#ecd5a34a';ctx.fillStyle='#e6d2a214';ctx.lineWidth=2;
for(const sign of [-1,1]){ctx.save();ctx.translate(730,390+sign*55);ctx.rotate(sign*.2-.18);ctx.beginPath();ctx.ellipse(0,0,132,88,0,sign===1?0:Math.PI,sign===1?Math.PI:Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();}
ctx.fillStyle='#e8d59e0c';ctx.beginPath();ctx.arc(840,330,175,0,Math.PI*2);ctx.fill();
art.creature(ctx,840,330,132,5,-.18,0);
for(const [x,y,r]of [[612,544,11],[1060,180,8],[1030,500,6]]){ctx.fillStyle='#a8efcd';for(let i=0;i<3;i++){const a=i*Math.PI*2/3;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*r*.45,y+Math.sin(a)*r*.45,r*.65,r*.38,a,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff6bf';ctx.beginPath();ctx.arc(x,y,r*.24,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#a9d5c5';ctx.font='600 14px system-ui';ctx.fillText('C O L O U R F U L   C R E A T U R E S',74,217);
ctx.fillStyle='#f0d09a';ctx.font='300 105px system-ui';ctx.fillText('M O L T',66,332);
ctx.fillStyle='#d9e9d8';ctx.font='400 22px system-ui';ctx.fillText('Eat. Grow. Transform.',74,387);
ctx.fillStyle='#93bbaf';ctx.font='400 15px system-ui';ctx.fillText('A small life. An extraordinary transformation.',75,431);
document.documentElement.dataset.ready='true';
</script></html>
