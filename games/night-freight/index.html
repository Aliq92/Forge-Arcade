<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c22"><title>NIGHT FREIGHT · Forge Arcade</title><meta name="description" content="Work a magnetic crane at a miniature night harbour. Swing, stack and dispatch three steel shipments, or practice in Free Lift."><link rel="stylesheet" href="style.css"></head>
<body><main id="game">
<header><a id="forge-back-link" class="arcade-back" href="../../index.html" aria-label="Back to Forge Arcade">← Arcade</a><a class="brand" href="./index.html" aria-label="Night Freight home"><span class="brand-mark">▥</span><span>NIGHT FREIGHT<small>FORGE ARCADE / HARBOUR OPERATIONS</small></span></a><nav aria-label="Game options"><button id="help" title="Controls">?</button><button id="sound">Sound off</button><button id="restart">Restart</button><button id="pause">II Pause</button></nav></header>

<section class="viewport" aria-label="Harbour crane playfield"><canvas id="scene" width="1200" height="760" aria-label="Magnetic crane, cargo dock and barge. Use directional controls to move the crane, and Space to toggle the magnet."></canvas><div class="scene-tag"><span class="live-dot"></span> NORTH QUAY <span>23:48</span></div><div id="toast" role="status" aria-live="polite"></div><div id="overlay" class="overlay"></div></section>

<footer><span>A / D <b>travel</b> <em>·</em> W / S <b>hoist</b> <em>·</em> SPACE <b>magnet</b></span><div><button id="mode">Free Lift ↗</button><label id="rock-setting" hidden><input id="rock" type="checkbox" checked> Gentle rocking</label><span>NO RUSH. MAKE IT LAND.</span></div></footer>
