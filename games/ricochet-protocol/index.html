<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070c">
    <title>RICOCHET PROTOCOL</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Ricochet Protocol game">
      <section class="stage" aria-label="Game stage">
        <canvas id="game-canvas" width="390" height="844" aria-label="Ricochet Protocol playfield">
          Your browser does not support the game canvas.
        </canvas>

        <header class="hud" aria-label="Game status">
          <dl class="hud-stats">
            <div><dt>Score</dt><dd id="score">0</dd></div>
            <div><dt>Combo</dt><dd id="combo">×1</dd></div>
            <div><dt>Integrity</dt><dd id="integrity">3</dd></div>
            <div><dt>Energy</dt><dd id="energy">5</dd></div>
          </dl>
          <nav class="hud-controls" aria-label="Game controls">
            <button id="pause-button" type="button" aria-label="Pause game" aria-pressed="false">Pause</button>
            <button id="music-button" type="button" aria-label="Mute music" aria-pressed="false">Music</button>
            <button id="effects-button" type="button" aria-label="Mute sound effects" aria-pressed="false">Effects</button>
          </nav>
        </header>

        <section id="upgrade-overlay" class="overlay" hidden aria-labelledby="upgrade-title" aria-modal="true" role="dialog">
          <h1 id="upgrade-title">Protocol upgrade</h1>
          <p>Choose one upgrade for the next chambers.</p>
          <div id="upgrade-options" class="upgrade-options" aria-label="Available upgrades"></div>
        </section>

        <section id="results-overlay" class="overlay" hidden aria-labelledby="results-title" aria-modal="true" role="dialog">
          <h1 id="results-title">Run complete</h1>
          <dl class="results-stats">
            <div><dt>Score</dt><dd id="result-score">0</dd></div>
            <div><dt>Best score</dt><dd id="best-score">0</dd></div>
            <div><dt>Chambers cleared</dt><dd id="chambers-cleared">0</dd></div>
          </dl>
          <button id="restart-button" type="button">Restart run</button>
        </section>

        <section id="pause-overlay" class="overlay pause-overlay" hidden aria-label="Game paused">
          <h1>Protocol paused</h1>
          <p>Tap Resume to return to the vault.</p>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
