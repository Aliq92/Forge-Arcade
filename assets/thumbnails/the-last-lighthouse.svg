    <linearGradient id="fog" x2="1" y2="0"><stop stop-color="#8aadb7" stop-opacity="0"/><stop offset=".48" stop-color="#9cb6bb" stop-opacity=".14"/><stop offset="1" stop-color="#8aadb7" stop-opacity="0"/></linearGradient>
