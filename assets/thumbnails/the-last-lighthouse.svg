  <title id="title">The Last Lighthouse</title>
  <desc id="desc">An ivory lighthouse rises from a rocky island, shining a golden cone across a teal sea. Fishing, sailing, and cargo vessels approach a mint-lit harbor through fog and coral reefs.</desc>
